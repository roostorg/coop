services:
  redis:
    image: redis:8.6.1-trixie
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - '256mb'
      - --maxmemory-policy
      - noeviction
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -qx PONG']
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 384M

  # Runs all migrations from scratch, after clearing the database(s).
  migrations:
    image: node:24.21.0-bookworm-slim
    command: bash -c 'set -e && npm install -g pnpm@10.34.5
      && pnpm install --filter coop-data-migrator --frozen-lockfile --store-dir /tmp/pnpm-store
      && ( [ "${CI:-}" = "true" ] && ( cd db && NODE_OPTIONS="--loader ts-node/esm" node src/index.ts clean --env staging ) || true )
      && for db in api-server-pg scylla clickhouse; do
      ( cd db && NODE_OPTIONS="--loader ts-node/esm" node src/index.ts create --db "$$db" --env staging );
      ( cd db && NODE_OPTIONS="--loader ts-node/esm" node src/index.ts apply --db "$$db" --env staging );
      done'
    working_dir: /src
    env_file: ./.env.githubci
    environment:
      - MIGRATOR_DB_NAME
      - CLICKHOUSE_DATABASE
    volumes:
      - .:/src
      # The container's pnpm install would otherwise replace the host's
      # node_modules (a filtered install prunes the other packages), so give
      # each workspace package its own container-only node_modules.
      - /src/node_modules
      - /src/client/node_modules
      - /src/server/node_modules
      - /src/types/node_modules
      - /src/db/node_modules
      - /src/migrator/node_modules
      - /src/nodejs-instrumentation/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      scylla:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  drop_dbs:
    image: node:24.21.0-bookworm-slim
    command: bash -c 'npm install -g pnpm@10.34.5 && pnpm install --filter coop-data-migrator --frozen-lockfile --store-dir /tmp/pnpm-store && ( cd db && NODE_OPTIONS="--loader ts-node/esm" node src/index.ts drop --env staging )'
    working_dir: /src
    env_file: ./.env.githubci
    environment:
      - CLICKHOUSE_DATABASE
      - MIGRATOR_DB_NAME
    volumes:
      - .:/src
      # The container's pnpm install would otherwise replace the host's
      # node_modules (a filtered install prunes the other packages), so give
      # each workspace package its own container-only node_modules.
      - /src/node_modules
      - /src/client/node_modules
      - /src/server/node_modules
      - /src/types/node_modules
      - /src/db/node_modules
      - /src/migrator/node_modules
      - /src/nodejs-instrumentation/node_modules
    depends_on:
      - postgres

  postgres:
    image: postgres:15.18
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'postgres']
      interval: 2s
      start_period: 2s
    environment:
      POSTGRES_PASSWORD: postgres123
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres

  hma:
    build:
      context: ./hma
      dockerfile: Dockerfile
    environment:
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_HOST=postgres
    ports:
      - '9876:9876'
    depends_on:
      - postgres

  scylla:
    image: scylladb/scylla:5.2
    # Cap Scylla's footprint so it doesn't grab nearly all available RAM
    # on small hosts (it allocates ~all "available" memory at startup by
    # default, which starves the rest of the stack on a VPS env).
    command: --smp 1 --memory 4G --overprovisioned 1 --developer-mode 1
    volumes:
      - scylla_data:/var/lib/scylla
    ports:
      - '9042:9042'
    healthcheck:
      # nodetool status only confirms gossip is up, not that the CQL port
      # (9042) is accepting and completing queries yet — that gap lets
      # dependents (e.g. db:create/db:update via cassandra-driver) connect
      # before Scylla is actually ready, causing timeouts even though
      # Compose reports the container healthy.
      test:
        [
          'CMD-SHELL',
          'cqlsh -e "SELECT release_version FROM system.local" || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 28
      start_period: 35s

  # Runs the api server's tests
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: server_base
    init: true
    command: bash -c 'pnpm run test:ci'
    working_dir: /app/server
    volumes:
      - ./server/reports:/app/server/reports
    env_file: ./.env.githubci
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: server_base
    init: true
    command: pnpm run lint

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: client_base
    command: pnpm run lint
    working_dir: /app/client
    volumes:
      - ./client/eslint:/app/client/eslint
      - ./client/.eslintrc.cjs:/app/client/.eslintrc.cjs
      - ./client/eslint.config.mjs:/app/client/eslint.config.mjs

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - '16686:16686'
      - '14268'
      - '14250'
    environment:
      - LOG_LEVEL=info

  otel-collector:
    # We have to pin to this version of the collector, because versions beyond
    # this do not support the Jaeger exporter. See here for details:
    # https://github.com/open-telemetry/opentelemetry-specification/pull/2858
    image: otel/opentelemetry-collector-contrib:0.71.0
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml
    command: ['--config=/etc/otel-collector.yaml']
    ports:
      - '1888:1888' # pprof extension
      - '13133:13133' # health_check extension
      - '4317:4317' # OTLP gRPC receiver
      - '55670:55679' # zpages extension
    depends_on:
      - jaeger

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - '8123:8123' # HTTP interface
      - '9000:9000' # Native TCP interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: 'clickhouse'
    healthcheck:
      test:
        ['CMD-SHELL', 'clickhouse-client --host localhost --query "SELECT 1"']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
  scylla_data:
  redis_data:
  clickhouse_data:

networks:
  default:
    # Scylla was automatically starting on both ipv4 and ipv6 causing it to
    # crash due to an invalid number of arguments being passed to its
    # entrypoint.
    enable_ipv6: false
