# Layered over docker-compose.images.yaml; devcontainer.json sets COMPOSE_FILE so
# plain `docker compose` picks this up. It builds Coop from this checkout instead
# of pulling the published images, so a codespace on a branch shows that branch,
# and it creates the demo login from COOP_DEMO_EMAIL and COOP_DEMO_PASSWORD.

services:
  migrations:
    image: coop-migrations:codespace
    build:
      context: .
      dockerfile: db/Dockerfile

  seed:
    image: coop-server:codespace
    build:
      context: .
      dockerfile: Dockerfile
      target: build_server
    environment:
      COOP_DEMO_EMAIL: ${COOP_DEMO_EMAIL:?}
      COOP_DEMO_PASSWORD: ${COOP_DEMO_PASSWORD:?}
    command:
      - |
        OUTPUT=$$(node bin/create-org-and-user.js \
          --name "Demo Org" \
          --email "$$COOP_DEMO_EMAIL" \
          --website "https://demo.coop.local" \
          --firstName "Demo" \
          --lastName "Admin" \
          --password "$$COOP_DEMO_PASSWORD" 2>&1) \
        && { echo "Created the demo login $$COOP_DEMO_EMAIL."; exit 0; }
        # On a restart the org already exists, so creating it fails. A run that
        # stopped part-way leaves the org without its user, though, so check
        # for the user itself.
        node --input-type=module -e "
          import pg from 'pg';
          const db = new pg.Client({
            host: process.env.DATABASE_HOST,
            port: process.env.DATABASE_PORT,
            database: process.env.DATABASE_NAME,
            user: process.env.DATABASE_USER,
            password: process.env.DATABASE_PASSWORD,
          });
          await db.connect();
          const { rowCount } = await db.query(
            'SELECT 1 FROM users WHERE email = \$$1', [process.env.COOP_DEMO_EMAIL]);
          await db.end();
          process.exit(rowCount > 0 ? 0 : 1);
        " && { echo "The demo login already exists."; exit 0; }
        echo "$$OUTPUT"
        echo "Couldn't create the demo login $$COOP_DEMO_EMAIL."
        exit 1

  server:
    image: coop-server:codespace
    build:
      context: .
      dockerfile: Dockerfile
      target: build_server
    environment:
      # Links the server puts in emails and invites.
      UI_URL: ${COOP_UI_URL:-http://localhost:3000}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/api/v1/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 60

  client:
    image: coop-client:codespace
    build:
      context: .
      dockerfile: client/Dockerfile
      target: serve
    # Codespaces can open the UI in the browser as soon as port 3000 is published,
    # so start the client only once the server answers.
    depends_on:
      server:
        condition: service_healthy
