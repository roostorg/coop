name: Dependency Review

on:
  pull_request:

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  dependency-review:
    name: Check dependencies for vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Warn on any known vulnerability
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          warn-only: true
          fail-on-scopes: runtime,development,unknown
          comment-summary-in-pr: on-failure

      - name: Fail on high severity vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime,development,unknown
          comment-summary-in-pr: on-failure

  # Dependency review only sees packages whose own version changes, so it
  # misses an existing vulnerable version that a bump newly pulls into the
  # production dependencies.
  new-advisories:
    name: Check for new advisories in production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          install: false

      # The checkout is the PR's merge commit; its first parent is the base.
      - name: Compare advisories with the base branch
        run: bash scripts/check-new-advisories.sh HEAD^1
