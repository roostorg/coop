name: Draft release notes

on:
  # Only trusted default-branch code runs; PR descriptions are data, including on forks.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, edited, closed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-notes-${{ github.event.pull_request.number || 'refresh' }}
  cancel-in-progress: false

jobs:
  labels:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - run: node scripts/release-notes.mjs labels
        env:
          GH_TOKEN: ${{ github.token }}

  draft:
    needs: labels
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.labels.result == 'success' && github.event.pull_request.merged == true))
    runs-on: ubuntu-latest
    concurrency:
      group: release-draft-main
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Find the previous release
        id: previous
        run: echo "tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          commitish: main
          publish: false
          # Preserve the pending entries until the first release after 1.2.0.
          header: >-
            ${{ steps.previous.outputs.tag == '1.2.0' &&
            '### Added


            - Formatting toolbar for policy definitions and enforcement guidelines ([#1432](https://github.com/roostorg/coop/pull/1432) by [@taobojlen](https://github.com/taobojlen)).


            ### Changed


            - Review console hides "Enqueue to NCMEC" when NCMEC reporting isn''t enabled ([#1470](https://github.com/roostorg/coop/pull/1470) by [@serendipty01](https://github.com/serendipty01))


            ' || '' }}
