name: Publish Packages

on:
  push:
    branches: [main]
    paths:
      - 'migrator/**'
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC i.e. publish package
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Check and publish migrator
        run: |
          cd migrator
          VERSION=$(node -p "require('./package.json').version")
          echo "Checking @roostorg/db-migrator@$VERSION..."

          if pnpm view "@roostorg/db-migrator@$VERSION" version >/dev/null 2>&1; then
            echo "⚠️  Version $VERSION of @roostorg/db-migrator already exists on npm - skipping"
          else
            echo "✅ Publishing @roostorg/db-migrator@$VERSION..."
            pnpm install --frozen-lockfile --ignore-scripts
            pnpm run build
            pnpm publish
          fi
