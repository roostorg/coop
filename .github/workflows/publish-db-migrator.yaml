name: Publish Packages

on:
  push:
    branches: [main]
    paths:
      - 'migrator/**'
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC i.e. publish package
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          install: false

      - name: Check and publish migrator
        run: |
          cd migrator
          VERSION=$(node -p "require('./package.json').version")
          echo "Checking @roostorg/db-migrator@$VERSION..."

          if pnpm view "@roostorg/db-migrator@$VERSION" version >/dev/null 2>&1; then
            echo "⚠️  Version $VERSION of @roostorg/db-migrator already exists on npm - skipping"
          else
            echo "✅ Publishing @roostorg/db-migrator@$VERSION..."
            pnpm install --filter @roostorg/db-migrator --frozen-lockfile --ignore-scripts
            pnpm run build
            pnpm publish
          fi
