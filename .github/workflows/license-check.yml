name: License Check
on:
  pull_request:
    branches: [main]
    paths:
      - 'pnpm-lock.yaml'
      - 'scripts/check-licenses.mjs'
      - '.github/workflows/license-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ALLOWED_LICENSES: |
        0BSD
        Apache-2.0
        BSD-2-Clause
        BSD-3-Clause
        BlueOak-1.0.0
        BSL-1.0
        CC0-1.0
        ISC
        MIT
        Python-2.0
        Unlicense
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          install: false

      - name: Format license list
        run: echo "ALLOWED_LICENSES=$(echo "$ALLOWED_LICENSES" | tr '\n' ';' | sed 's/;$//')" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check licenses
        # shell: bash adds pipefail, so a failing `pnpm licenses` fails the step.
        # -r lists the production dependencies of every workspace package.
        shell: bash
        run: pnpm licenses list --prod --json -r | node scripts/check-licenses.mjs
