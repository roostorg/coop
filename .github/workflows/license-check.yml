name: License Check
on:
  pull_request:
    branches: [main]
    paths:
      - 'pnpm-lock.yaml'
      - 'scripts/check-licenses.mjs'
      - '.github/workflows/license-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ALLOWED_LICENSES: |
        0BSD
        Apache-2.0
        BSD-2-Clause
        BSD-3-Clause
        BlueOak-1.0.0
        BSL-1.0
        CC0-1.0
        ISC
        MIT
        Python-2.0
        Unlicense
    strategy:
      matrix:
        directory:
          - .
          - client
          - db
          - migrator
          - nodejs-instrumentation
          - server
          - types
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Format license list
        run: echo "ALLOWED_LICENSES=$(echo "$ALLOWED_LICENSES" | tr '\n' ';' | sed 's/;$//')" >> "$GITHUB_ENV"

      # pnpm uses a single root lockfile, so install the whole workspace once and
      # list each package's production dependencies with --filter.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check licenses
        # shell: bash adds pipefail, so a failing `pnpm licenses` fails the step.
        shell: bash
        run: pnpm licenses list --prod --json --filter "./${{ matrix.directory }}" | node scripts/check-licenses.mjs
