name: Embargo lineage

# Private copies of roostorg/coop only: checks that a PR branch holds only
# upstream main plus its own commits (scripts/embargo/check-lineage.sh), so it
# can land publicly. Never runs in roostorg/coop or in public repositories.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

concurrency:
  group: embargo-lineage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lineage:
    name: Lineage
    # pull_request payloads always carry repository.private, so this needs no
    # API call that could fail and skip the check.
    if: github.repository != 'roostorg/coop' && github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require base main and a same-repository branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          failed=0
          if [[ "$BASE_REF" != 'main' ]]; then
            echo "::error title=Lineage::PRs must target main, not $BASE_REF: land stacked work one branch at a time."
            failed=1
          fi
          # The check identifies the PR's own branch by name, which only holds
          # for branches in this repository.
          if [[ "$HEAD_REPO" != "$REPO" ]]; then
            echo '::error title=Lineage::PRs must come from a branch in this repository, not a fork.'
            failed=1
          fi
          exit "$failed"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Runs main's copy of the script so a PR's edits to the script do not
      # apply to its own check. Edits to this workflow file do; protect it
      # with review rules in each private copy.
      - name: Check lineage
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git show origin/main:scripts/embargo/check-lineage.sh > "$RUNNER_TEMP/check-lineage.sh"
          bash "$RUNNER_TEMP/check-lineage.sh" --no-fetch-remote --rev "$HEAD_SHA" "$HEAD_REF"
