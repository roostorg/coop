name: Publish Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'client/**'
      - 'db/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'Dockerfile'
      - 'client/Dockerfile'
      - '.github/workflows/publish-docker.yaml'
      - '.github/actions/scan-image/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional semver version tag to publish (e.g. 1.0.0 or 1.1.0-alpha), for backfilling a release. Leave blank for an SHA-only build. Moves :latest only when run from the highest release tag.'
        required: false
        type: string

permissions:
  contents: read

# Avoid redundant concurrent builds for the same ref (expensive multi-arch).
# Keyed per-ref so releases (tag refs) never cancel main builds. Tag builds
# share one group and never cancel, so they run one at a time and the
# highest-tag check for `latest` can't be overtaken by an older tag's push.
# A group holds one pending run, so a third tag build cancels the queued one;
# re-run it once the others finish.
concurrency:
  group: publish-docker-${{ startsWith(github.ref, 'refs/tags/') && 'tags' || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  # Shared tag policy: release -> version tags, plus `latest` only when the
  # release is the highest stable semver tag (see the `latest` step); main ->
  # `edge` + sha; manual dispatch -> sha (+ optional `version`), and from a
  # tag also its version tags and, if it's the highest release, `latest`.
  # Use `github.event.inputs` since `inputs` is unset on push/release.
  TAGS: |
    type=sha,prefix=
    type=edge,branch=main,enable=${{ github.event_name != 'workflow_dispatch' }}
    type=ref,event=tag
    type=semver,pattern={{version}}
    type=semver,pattern={{major}}.{{minor}}
    type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      db: ${{ steps.filter.outputs.db }}
      latest: ${{ steps.latest.outputs.latest }}
      scan-channel: ${{ steps.scan-target.outputs.channel }}
      scan-ref: ${{ steps.scan-target.outputs.ref }}
    steps:
      # Reject arbitrary dispatch input so it can't become an image tag like
      # `coop-server:squirtle`. Passed via env to avoid shell injection.
      - name: Validate version input
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version input. Expected semver like 1.2.3, v1.2.3, or 1.2.3-alpha."
            exit 1
          fi

      # Releases and version backfills report under the release tag in the
      # `release` channel; everything else under its own ref as `edge`.
      - name: Pick scan category and ref
        id: scan-target
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            echo "channel=release" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_REF" >> "$GITHUB_OUTPUT"
          elif [ -n "$VERSION" ]; then
            echo "channel=release" >> "$GITHUB_OUTPUT"
            echo "ref=refs/tags/${VERSION#v}" >> "$GITHUB_OUTPUT"
          else
            echo "channel=edge" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_REF" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A patch on an older line (e.g. 1.1.2 from release/1.1 after 1.2.0)
      # must not move `latest` backwards, so it moves only when the tag being
      # built is the highest stable x.y.z tag in the repo. Covers releases and
      # dispatches run from a tag.
      - name: Decide whether to move latest
        id: latest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          highest=$(git ls-remote --tags --refs "$REPO_URL" \
            | sed 's|.*refs/tags/||' \
            | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | sort -V | tail -n 1)
          if [ "$TAG" = "$highest" ]; then
            echo "latest=auto" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG is not the highest x.y.z release (${highest:-none}); not moving latest."
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            server:
              - 'server/**'
              - 'Dockerfile'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            client:
              - 'client/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            db:
              - 'db/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'

      # On release/dispatch, paths-filter is skipped so outputs are empty.
      # The downstream jobs use != 'false', so empty triggers a build.

  build-server:
    needs: changes
    if: needs.changes.outputs.server != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write # to sign the SBOM attestation
      attestations: write # to store the SBOM attestation
    strategy:
      # One image's failure shouldn't cancel the other's publish.
      fail-fast: false
      matrix:
        include:
          - target: build_server
            image: coop-server
          - target: build_worker_runner
            image: coop-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: ${{ env.TAGS }}
          flavor: latest=${{ needs.changes.outputs.latest || 'auto' }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ID=${{ github.sha }}
          # server + worker share a Dockerfile/intermediate stages: read both
          # scopes for reuse, write only our own to avoid concurrent-write races.
          cache-from: |
            type=gha,scope=coop-server
            type=gha,scope=coop-worker
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max

      - uses: $/.github/actions/scan-image
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          category: trivy-${{ matrix.image }}-${{ needs.changes.outputs.scan-channel }}
          ref: ${{ needs.changes.outputs.scan-ref }}
          sha: ${{ github.sha }}

      # An SBOM failure fails releases and version backfills, not other builds.
      - name: Generate SBOM
        id: sbom
        continue-on-error: ${{ needs.changes.outputs.scan-channel != 'release' }}
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          SBOM: sbom.cdx.json
        # Trivy doesn't list the Node.js runtime, so add it from the node base
        # image's NODE_VERSION.
        run: |
          "$RUNNER_TEMP/trivy-bin/trivy" image --quiet --platform linux/amd64 --format cyclonedx --output sbom.json "$IMAGE"
          NODE_VERSION=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Image}}' | jq -r '.["linux/amd64"].config.Env[] | select(startswith("NODE_VERSION=")) | ltrimstr("NODE_VERSION=")')
          test -n "$NODE_VERSION"
          jq --arg v "$NODE_VERSION" '.components += [{"bom-ref": "pkg:generic/node@\($v)", type: "application", name: "node", version: $v, purl: "pkg:generic/node@\($v)", cpe: "cpe:2.3:a:nodejs:node.js:\($v):*:*:*:*:*:*:*"}]' sbom.json > "$SBOM"

      # Releases are immutable once published, so the SBOM is attested to the
      # image instead of attached to the release.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: steps.sbom.outcome == 'success'
        continue-on-error: ${{ needs.changes.outputs.scan-channel != 'release' }}
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
          create-storage-record: false

  build-client:
    needs: changes
    if: needs.changes.outputs.client != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write # to sign the SBOM attestation
      attestations: write # to store the SBOM attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/coop-client
          tags: ${{ env.TAGS }}
          flavor: latest=${{ needs.changes.outputs.latest || 'auto' }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: client/Dockerfile
          target: serve
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ID=${{ github.sha }}
          cache-from: type=gha,scope=coop-client
          cache-to: type=gha,scope=coop-client,mode=max
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max

      - uses: $/.github/actions/scan-image
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/coop-client@${{ steps.build.outputs.digest }}
          category: trivy-coop-client-${{ needs.changes.outputs.scan-channel }}
          ref: ${{ needs.changes.outputs.scan-ref }}
          sha: ${{ github.sha }}

      - name: Generate SBOM
        id: sbom
        continue-on-error: ${{ needs.changes.outputs.scan-channel != 'release' }}
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/coop-client@${{ steps.build.outputs.digest }}
          SBOM: sbom.cdx.json
        run: '"$RUNNER_TEMP/trivy-bin/trivy" image --quiet --platform linux/amd64 --format cyclonedx --output "$SBOM" "$IMAGE"'

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: steps.sbom.outcome == 'success'
        continue-on-error: ${{ needs.changes.outputs.scan-channel != 'release' }}
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/coop-client
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
          create-storage-record: false

  # Bundles the db/ migration files + configs into an image meant to be run as a
  # one-shot task on deploy.
  # On push to main it publishes only when something under db/ changed (e.g. a
  # new migration script). On a release it always publishes a versioned tag.
  build-migrations:
    needs: changes
    if: needs.changes.outputs.db != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write # to sign the SBOM attestation
      attestations: write # to store the SBOM attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/coop-migrations
          tags: ${{ env.TAGS }}
          flavor: latest=${{ needs.changes.outputs.latest || 'auto' }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: db/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=coop-migrations
          cache-to: type=gha,scope=coop-migrations,mode=max
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max

      - uses: $/.github/actions/scan-image
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/coop-migrations@${{ steps.build.outputs.digest }}
          category: trivy-coop-migrations-${{ needs.changes.outputs.scan-channel }}
          ref: ${{ needs.changes.outputs.scan-ref }}
          sha: ${{ github.sha }}

      - name: Generate SBOM
        id: sbom
        continue-on-error: ${{ needs.changes.outputs.scan-channel != 'release' }}
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/coop-migrations@${{ steps.build.outputs.digest }}
          SBOM: sbom.cdx.json
        # Trivy doesn't list the Node.js runtime, so add it from the node base
        # image's NODE_VERSION.
        run: |
          "$RUNNER_TEMP/trivy-bin/trivy" image --quiet --platform linux/amd64 --format cyclonedx --output sbom.json "$IMAGE"
          NODE_VERSION=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Image}}' | jq -r '.["linux/amd64"].config.Env[] | select(startswith("NODE_VERSION=")) | ltrimstr("NODE_VERSION=")')
          test -n "$NODE_VERSION"
          jq --arg v "$NODE_VERSION" '.components += [{"bom-ref": "pkg:generic/node@\($v)", type: "application", name: "node", version: $v, purl: "pkg:generic/node@\($v)", cpe: "cpe:2.3:a:nodejs:node.js:\($v):*:*:*:*:*:*:*"}]' sbom.json > "$SBOM"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: steps.sbom.outcome == 'success'
        continue-on-error: ${{ needs.changes.outputs.scan-channel != 'release' }}
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/coop-migrations
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
          create-storage-record: false
