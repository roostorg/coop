name: Publish Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'client/**'
      - 'db/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'Dockerfile'
      - 'client/Dockerfile'
      - '.github/workflows/publish-docker.yaml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional semver version tag to publish (e.g. 1.0.0 or 1.1.0-alpha), for backfilling a release. Leave blank for an SHA-only build; does not move :latest.'
        required: false
        type: string

permissions:
  contents: read

# Avoid redundant concurrent builds for the same ref (expensive multi-arch).
# Keyed per-ref so releases (tag refs) never cancel main builds.
concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Shared tag policy: release -> version tags + auto `latest` (newest
  # non-prerelease); main -> `edge` + sha; manual dispatch -> sha (+ optional
  # `version`). Use `github.event.inputs` since `inputs` is unset on push/release.
  TAGS: |
    type=sha,prefix=
    type=edge,branch=main,enable=${{ github.event_name != 'workflow_dispatch' }}
    type=ref,event=tag
    type=semver,pattern={{version}}
    type=semver,pattern={{major}}.{{minor}}
    type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}
  # Trivy is installed from its release tarball with a pinned checksum rather
  # than through aquasecurity/trivy-action or setup-trivy (GHSA-69fq-xp46-6x23).
  TRIVY_VERSION: 0.76.1
  TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
  TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      # Reject arbitrary dispatch input so it can't become an image tag like
      # `coop-server:squirtle`. Passed via env to avoid shell injection.
      - name: Validate version input
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version input. Expected semver like 1.2.3, v1.2.3, or 1.2.3-alpha."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            server:
              - 'server/**'
              - 'Dockerfile'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            client:
              - 'client/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            db:
              - 'db/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'

      # On release/dispatch, paths-filter is skipped so outputs are empty.
      # The downstream jobs use != 'false', so empty triggers a build.

  build-server:
    needs: changes
    if: needs.changes.outputs.server != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      matrix:
        include:
          - target: build_server
            image: coop-server
          - target: build_worker_runner
            image: coop-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: ${{ env.TAGS }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ID=${{ github.sha }}
          # server + worker share a Dockerfile/intermediate stages: read both
          # scopes for reuse, write only our own to avoid concurrent-write races.
          cache-from: |
            type=gha,scope=coop-server
            type=gha,scope=coop-worker
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max

      - name: Install Trivy
        run: |
          curl -fsSLo "$RUNNER_TEMP/trivy.tar.gz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"

      # Report-only: findings go to code scanning (visible to maintainers, not
      # the public) and never block a push, so a security release can always
      # ship. continue-on-error keeps a Trivy or DB outage from failing a job
      # whose images are already published.
      - name: Scan image
        continue-on-error: true
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: trivy image --quiet --scanners vuln --format sarif --output trivy.sarif "$IMAGE"

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.image }}-${{ github.event_name == 'release' && 'release' || 'edge' }}

      - name: Generate SBOM
        if: github.event_name == 'release'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          SBOM: ${{ matrix.image }}-${{ github.event.release.tag_name }}.cdx.json
        run: trivy image --quiet --format cyclonedx --output "$SBOM" "$IMAGE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'release'
        with:
          name: sbom-${{ matrix.image }}
          path: ${{ matrix.image }}-${{ github.event.release.tag_name }}.cdx.json
          if-no-files-found: error

  build-client:
    needs: changes
    if: needs.changes.outputs.client != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/coop-client
          tags: ${{ env.TAGS }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: client/Dockerfile
          target: serve
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ID=${{ github.sha }}
          cache-from: type=gha,scope=coop-client
          cache-to: type=gha,scope=coop-client,mode=max
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max

      - name: Install Trivy
        run: |
          curl -fsSLo "$RUNNER_TEMP/trivy.tar.gz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"

      # Report-only: findings go to code scanning (visible to maintainers, not
      # the public) and never block a push, so a security release can always
      # ship. continue-on-error keeps a Trivy or DB outage from failing a job
      # whose images are already published.
      - name: Scan image
        continue-on-error: true
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/coop-client@${{ steps.build.outputs.digest }}
        run: trivy image --quiet --scanners vuln --format sarif --output trivy.sarif "$IMAGE"

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-coop-client-${{ github.event_name == 'release' && 'release' || 'edge' }}

      - name: Generate SBOM
        if: github.event_name == 'release'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/coop-client@${{ steps.build.outputs.digest }}
          SBOM: coop-client-${{ github.event.release.tag_name }}.cdx.json
        run: trivy image --quiet --format cyclonedx --output "$SBOM" "$IMAGE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'release'
        with:
          name: sbom-coop-client
          path: coop-client-${{ github.event.release.tag_name }}.cdx.json
          if-no-files-found: error

  # Bundles the db/ migration files + configs into an image meant to be run as a
  # one-shot task on deploy.
  # On push to main it publishes only when something under db/ changed (e.g. a
  # new migration script). On a release it always publishes a versioned tag.
  build-migrations:
    needs: changes
    if: needs.changes.outputs.db != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/coop-migrations
          tags: ${{ env.TAGS }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: db/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=coop-migrations
          cache-to: type=gha,scope=coop-migrations,mode=max
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max

      - name: Install Trivy
        run: |
          curl -fsSLo "$RUNNER_TEMP/trivy.tar.gz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"

      # Report-only: findings go to code scanning (visible to maintainers, not
      # the public) and never block a push, so a security release can always
      # ship. continue-on-error keeps a Trivy or DB outage from failing a job
      # whose images are already published.
      - name: Scan image
        continue-on-error: true
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/coop-migrations@${{ steps.build.outputs.digest }}
        run: trivy image --quiet --scanners vuln --format sarif --output trivy.sarif "$IMAGE"

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-coop-migrations-${{ github.event_name == 'release' && 'release' || 'edge' }}

      - name: Generate SBOM
        if: github.event_name == 'release'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/coop-migrations@${{ steps.build.outputs.digest }}
          SBOM: coop-migrations-${{ github.event.release.tag_name }}.cdx.json
        run: trivy image --quiet --format cyclonedx --output "$SBOM" "$IMAGE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'release'
        with:
          name: sbom-coop-migrations
          path: coop-migrations-${{ github.event.release.tag_name }}.cdx.json
          if-no-files-found: error

  # Kept separate so contents: write never sits in a job holding registry
  # credentials.
  attach-sboms:
    needs: [build-server, build-client, build-migrations]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          merge-multiple: true
          path: sboms

      - name: Attach SBOMs to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" sboms/*.cdx.json --clobber
