name: Labeler

on:
  # Write access is required to label fork PRs. This workflow never checks out
  # or executes contributor-controlled code; the labeler reads its config from
  # the base branch and only inspects the list of changed file paths.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches: [main]
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  label:
    if: github.repository == 'roostorg/coop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
