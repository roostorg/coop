name: Publish Packages

on:
  push:
    branches: [main]
    paths:
      - 'types/**'
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC i.e. publish package
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          install: false

      - name: Check and publish types
        run: |
          cd types
          PKG_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Checking $PKG_NAME@$VERSION..."

          if pnpm view "$PKG_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "⚠️  Version $VERSION of $PKG_NAME already exists on npm - skipping"
          else
            echo "✅ Publishing $PKG_NAME@$VERSION..."
            pnpm install --filter @roostorg/coop-types --frozen-lockfile --ignore-scripts
            pnpm run build
            pnpm publish
          fi
