name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check_pr_title:
    name: Check PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recognize GitHub revert titles
        id: revert
        shell: bash
        run: |
          if [[ "$PR_TITLE" =~ ^Revert\ \".+\"$ && "$PR_TITLE" != *$'\n'* && "$PR_TITLE" != *$'\r'* ]]; then
            echo 'is_revert=true' >> "$GITHUB_OUTPUT"
          fi
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

      - name: Validate PR title
        if: steps.revert.outputs.is_revert != 'true'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        with:
          subjectPattern: ^(?![A-Z])\S(?:.*\S)?(?<!\.)$
          subjectPatternError: 'Start the description with a lowercase word, omit leading or trailing whitespace, and do not end it with a period.'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
