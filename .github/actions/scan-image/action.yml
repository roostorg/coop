name: Scan image
description: >
  Install Trivy to $RUNNER_TEMP/trivy-bin, scan a published image for
  vulnerabilities and upload the results to code scanning. Findings never fail
  the job; download, scan and upload failures do only with fail-on-error.

inputs:
  image:
    description: Image reference to scan.
    required: true
  category:
    description: Code scanning category for the results.
    required: true
  ref:
    description: Git ref to report the results under.
    required: true
  sha:
    description: Commit SHA to report the results under.
    required: true
  fail-on-error:
    description: >
      Fail the job if Trivy can't be downloaded, the scan fails or the upload
      fails. Leave off where a scan must never block a publish.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # Findings go to code scanning (visible to maintainers, not the public) and
    # never block a push, so a security release can always ship.
    # Without fail-on-error, continue-on-error keeps a download, Trivy or DB
    # outage from failing a job whose images are already published; a checksum
    # mismatch always fails.
    #
    # Trivy is installed from its release tarball with a pinned checksum rather
    # than through aquasecurity/trivy-action or setup-trivy
    # (GHSA-69fq-xp46-6x23). Not Dependabot-managed: bump TRIVY_VERSION and
    # TRIVY_SHA256 together by hand.
    - name: Download Trivy
      id: download
      continue-on-error: ${{ inputs.fail-on-error != 'true' }}
      shell: bash
      env:
        TRIVY_VERSION: 0.76.1
      run: curl -fsSL --retry 3 -o "$RUNNER_TEMP/trivy.tar.gz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"

    - name: Install Trivy
      if: steps.download.outcome == 'success'
      shell: bash
      env:
        TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
      run: |
        echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict -
        mkdir -p "$RUNNER_TEMP/trivy-bin"
        tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy-bin" trivy

    # Only vulnerabilities with a fixed package version are reported, for OS
    # and npm packages alike: most base-image CVEs are unfixed or "will not
    # fix" upstream, and alerts nobody can act on by upgrading bury the ones
    # that can be.
    - name: Scan image
      id: scan
      if: steps.download.outcome == 'success'
      continue-on-error: ${{ inputs.fail-on-error != 'true' }}
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
      run: '"$RUNNER_TEMP/trivy-bin/trivy" image --quiet --scanners vuln --ignore-unfixed --platform linux/amd64 --format sarif --output trivy.sarif "$IMAGE"'

    - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      if: steps.scan.outcome == 'success'
      continue-on-error: ${{ inputs.fail-on-error != 'true' }}
      with:
        sarif_file: trivy.sarif
        category: ${{ inputs.category }}
        ref: ${{ inputs.ref }}
        sha: ${{ inputs.sha }}
