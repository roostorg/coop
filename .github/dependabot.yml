# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Major version updates are disabled for now across every ecosystem/directory,
# except `github-actions` (see the note on that block below).
# Security updates are unaffected (Dependabot ignores `ignore` rules for
# security advisories), so majors still land when they fix a vulnerability.

version: 2

# Group Dockerfile and docker-compose node updates into the same PR to keep
# node versions in sync; .nvmrc still needs to be bumped separately to match.
multi-ecosystem-groups:
  docker-images:
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
      - 'dependabot'

updates:
  # Dockerfiles
  - package-ecosystem: 'docker'
    directories:
      - '/'
      - '/client'
      - '/db'
      - '/hma'
      - '/nodejs-instrumentation'
    patterns:
      - '*'
    multi-ecosystem-group: 'docker-images'
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
      - 'dependabot'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      docker-images-security:
        applies-to: 'security-updates'
        patterns:
          - '*'

  # Node images in Docker Compose
  - package-ecosystem: 'docker-compose'
    directory: '/'
    patterns:
      - 'node'
    multi-ecosystem-group: 'docker-images'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # One entry for the whole pnpm workspace. Dependabot reads
  # pnpm-workspace.yaml from the root and updates every package's
  # package.json together with the single root pnpm-lock.yaml. Per-package
  # entries don't work: a package directory has no lockfile of its own, so
  # their PRs change package.json alone and fail `--frozen-lockfile`.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # One day longer than pnpm-workspace.yaml's 7-day minimumReleaseAge, so a
    # proposed version is always old enough for `pnpm install` to accept.
    cooldown:
      default-days: 8
    labels:
      - 'dependencies'
      - 'dependabot'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Held back for the server; with one workspace entry these now apply to
      # every package.
      - dependency-name: 'type-fest'
        versions: ['>4.3.2 <5.0.0']
      - dependency-name: 'typescript'
        versions: ['>=5.0.0 <6.0.0']
    groups:
      npm-prod-security:
        dependency-type: 'production'
        applies-to: 'security-updates'
        patterns:
          - '*'
      npm-prod:
        dependency-type: 'production'
        applies-to: 'version-updates'
        patterns:
          - '*'
      npm-dev:
        dependency-type: 'development'
        applies-to: 'version-updates'
        patterns:
          - '*'

  # Enable version updates for GitHub Actions
  #
  # Deliberately *not* ignoring `version-update:semver-major` here, unlike the
  # ecosystems above. Actions majors are mostly runner-runtime bumps (e.g.
  # node20 -> node24) that GitHub eventually forces anyway; blocking them means
  # the pins rot until someone does a manual pass. Actions are also SHA-pinned
  # and reviewed here, so a bad major cannot land silently.
  #
  # Note: Dependabot bumps the action SHA only. Tool versions passed *into* an
  # action (e.g. the `version:` input of zizmorcore/zizmor-action, or the image
  # digest inside boostsecurityio/poutine-action) still need a manual bump.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
      - 'dependabot'
    groups:
      github-actions:
        patterns:
          - '*'
