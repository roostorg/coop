name-template: 'Coop $RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'
category-template: '### $TITLE'
change-template: '$BODY ([#$NUMBER]($URL) by [@$AUTHOR]($AUTHOR_URL))'
no-changes-template: ''
sync-labels: true
# Security releases are cut from release/x.y branches; only main's releases
# set the base version and changes for main's draft.
filter-by-commitish: true
# Ignore instructions, empty bullets, and subsequent sections.
autolabeler:
  - labels: [has-release-notes]
    body:
      - '/^## Release notes[ \t]*\r?\n(?:\s|<!--[\s\S]*?-->|[-*][ \t]+)*(?!<!--|#{1,2}(?:[ \t]|\r?$)|[-*](?:[ \t]|\r?$))\S/im'
categories:
  - type: pre-include
    when:
      label: has-release-notes
  - title: Security
    exclusive: true
    when:
      label: security-update
  - title: Added
    semver-increment: minor
    when:
      conventional:
        type: feat
  - title: Changed
  - title: Fixed
    when:
      conventional:
        type: fix
replacers:
  - target: change-body
    search: '/^## Release notes[ \t]*\r?$/gim'
    replace: '## Release notes'
  - target: change-body
    section: '## Release notes'
    not-found: empty
  # Keep the credit comment that security backport PRs end with; see the last replacer.
  - target: change-body
    search: '/<!--(?! original-credit: [^\n]*? -->\s*$)[\s\S]*?-->/g'
    replace: ''
  - target: change-body
    search: '/((?:^|\r?\n)[ \t]*(?:-{3,}|\*{3,}|_{3,})\s*)+$/'
    replace: ''
  - target: change-body
    search: '/^\s+|\s+$/g'
    replace: ''
  - target: change-body
    search: '/^(?![-*][ \t]+)(?=\S)/'
    replace: '- '
  # Credit a security backport to the source PR and its author, not the backport
  # PR and the app that opened it.
  - search: '/\s*<!-- original-credit: (\[#\d+\]\(https:\/\/github\.com\/[\w.-]+\/[\w.-]+\/pull\/\d+\) by \[@[\w-]+(?:\[bot\])?\]\(https:\/\/github\.com\/(?:apps\/)?[\w-]+\)) --> \(\[#\d+\]\(\S+\) by .*\)$/gm'
    replace: ' ($1)'
template: |
  $CHANGES
