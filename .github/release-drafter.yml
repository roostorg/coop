name-template: 'Coop $RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'
category-template: '### $TITLE'
change-template: '$BODY ([#$NUMBER]($URL) by [@$AUTHOR]($AUTHOR_URL))'
no-changes-template: ''
sync-labels: true
# Match a nonempty bullet after the section's optional instructions.
autolabeler:
  - labels: [has-release-notes]
    body:
      - '/^## Release notes[ \t]*\r?\n(?:\s|<!--[\s\S]*?-->)*[-*] [^\s<]/m'
categories:
  - type: pre-include
    when:
      label: has-release-notes
  - title: Added
    when:
      conventional:
        type: feat
  - title: Changed
  - title: Deprecated
    when:
      conventional:
        type: deprecate
  - title: Removed
    when:
      conventional:
        type: remove
  - title: Fixed
    when:
      conventional:
        type: fix
  - title: Security
    when:
      conventional:
        type: security
replacers:
  - target: change-body
    section: '## Release notes'
    not-found: empty
  - target: change-body
    search: '/<!--[\s\S]*?-->/g'
    replace: ''
  - target: change-body
    search: '/^\s+|\s+$/g'
    replace: ''
# Action inputs trim the bootstrap header's trailing whitespace.
template: "\n\n$CHANGES"
